# Alembic configuration. The database URL is NOT stored here — env.py reads it from
# app.core.config (which reads .env), so there are no credentials in version control.

[alembic]
script_location = alembic
prepend_sys_path = .
# sqlalchemy.url is intentionally omitted — set programmatically in env.py.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
