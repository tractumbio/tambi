# Reference-project capability corpus for capability-match scoring.
#
# PROVENANCE / HONESTY NOTE
# These are *illustrative capability descriptions* grounded in each firm's PUBLICLY
# stated focus areas in the Australian Defence / government market. They are NOT scraped
# contract records and make no claim about specific engagements, clients, or values.
# Replace or augment any firm's entries with your own verified engagement history — the
# loader upserts by (firm_slug, title), so editing this file and re-running the loader is
# the intended workflow.
#
# Applied SYMMETRICALLY: every firm gets a comparable-richness profile so the competitor
# comparison stays fair. Add/remove entries evenly if you extend it.

