name: Deploy (enterprise)

# Builds the real TAMBI images and rolls them onto the enterprise Container Apps.
# Infrastructure (Key Vault refs, managed identity, Azure OpenAI, Postgres) is owned
# by infra/main.enterprise.bicep and deployed separately — this workflow only swaps
# the container images. Push the enterprise branch content to `deploy-enterprise`,
# or run manually via workflow_dispatch on that branch.
on:
  workflow_dispatch:
  push:
    branches: [deploy-enterprise]

permissions:
  contents: read

env:
  RG: tambi-prod-rg
  PREFIX: tambi-prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build, push, and roll images
        run: |
          chmod +x scripts/ci-images-enterprise.sh
          RG="$RG" PREFIX="$PREFIX" ./scripts/ci-images-enterprise.sh
